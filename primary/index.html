<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">出</div><div><h1>小學出席管理</h1><small>Google Apps Script・小學專用</small></div></div>
      <div class="actions" style="justify-content:flex-end"><div id="userChip" class="user-chip" hidden></div><button id="resetButton" type="button" class="btn btn-secondary btn-small" hidden>登出／重設</button></div>
    </header>
    <section id="signinPanel" class="card signin-card" aria-labelledby="signinTitle">
      <h2 id="signinTitle">小學出席管理</h2>
      <p class="signin-lead">請用已獲授權嘅 Gmail 登入</p>
      <div id="gisButton" class="gis-button-wrap" aria-label="使用 Google 登入"></div>
      <div id="signinError" class="signin-error" role="alert" hidden></div>
      <div class="auth-note"><strong>帳戶及權限說明</strong>導師只可查看獲授權組別；行政可管理全部學生。請以行政已加入權限名單嘅 Gmail 登入。</div>
    </section>
    <div id="topNotice" class="notice" hidden><strong>資料安全提示</strong>現有名單及記錄會由系統讀取並保留；本頁不會使用瀏覽器儲存。未標記的學生不會列入出席提交。</div>
    <div id="alert" class="alert" role="alert" hidden></div>
    <div id="loading" class="loading" hidden><span class="spinner" aria-hidden="true"></span><span id="loadingText">正在載入…</span></div>
    <main id="main" hidden></main>
  </div>
  <nav id="bottomNav" class="bottom-nav hidden" aria-label="主導覽"><div id="navInner" class="nav-inner"></div></nav>
  <div id="modalRoot"></div>
<script>
(function(){
  'use strict';
  const gate=window.__attendanceGisGate={ready:false,failed:false,callbacks:[]};
  window.attendanceGisLoaded=function(){gate.ready=true;gate.callbacks.splice(0).forEach(function(fn){try{fn(true)}catch(e){}})};
  window.attendanceGisFailed=function(){gate.failed=true;gate.callbacks.splice(0).forEach(function(fn){try{fn(false)}catch(e){}})};
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="attendanceGisLoaded()" onerror="attendanceGisFailed()"></script>
<script>
(function(){
  'use strict';
  const $ = (s,root=document)=>root.querySelector(s);
  const main=$('#main'), alertBox=$('#alert'), loadingBox=$('#loading'), loadingText=$('#loadingText'), nav=$('#bottomNav'), navInner=$('#navInner'), modalRoot=$('#modalRoot'), signinPanel=$('#signinPanel'), signinError=$('#signinError'), userChip=$('#userChip'), resetButton=$('#resetButton');
  let idToken=null;
  const state={app:null,authorized:false,role:'',email:'',page:'',date:'',courseId:'',roster:null,marks:{},preview:null,rosterBusy:false,busy:false,rosterRequest:0,previewRequest:0,entity:null,editingKey:null};
  const ENTITIES=['students','teachers','classes','groups','courses','enrollments'];
  const ENTITY_LABEL={students:'學生',teachers:'教師權限',classes:'班別',groups:'組別',courses:'課程',enrollments:'報讀'};
  const ENTITY_CONFIG={
    students:{key:'學生ID',aliases:['學生ID','student_id','studentId','ID']}, teachers:{key:'教師Gmail',aliases:['教師Gmail','Gmail','教師電郵','電郵','Email','email','teacher_email']},
    classes:{key:'班別',aliases:['班別','class_name','班級','班別名稱']}, groups:{key:'組別ID',aliases:['組別ID','group_id','groupId']},
    courses:{key:'課程ID',aliases:['課程ID','course_id','courseId']}, enrollments:{key:null,aliases:[]}
  };
  const STATUS=['未標記','出席','缺席','遲到','請假'];
  const NAV_ADMIN=[['overview','概覽','概'],['attendance','點名','點'],['teachers','教師權限','師'],['groups','組別','組'],['courses','課程','課'],['students','學生','生'],['enrollments','報讀','讀']];
  const NAV_TUTOR=[['overview','概覽','概'],['attendance','點名','點']];

  function escapeText(v){return String(v==null?'':v)}
  function setLoading(on,text){loadingBox.hidden=!on;if(text)loadingText.textContent=text}
  function setBusy(on){state.busy=on;document.querySelectorAll('button,input,select,textarea').forEach(el=>{if(on){if(!el.hasAttribute('data-busy-lock'))el.setAttribute('data-busy-lock',el.disabled?'1':'0');el.disabled=true}else if(el.hasAttribute('data-busy-lock')){el.disabled=el.getAttribute('data-busy-lock')==='1';el.removeAttribute('data-busy-lock')}})}
  function showError(message){alertBox.textContent=message;alertBox.hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
  function clearError(){alertBox.textContent='';alertBox.hidden=true}
  function html(tag,attrs={},text){const n=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='class')n.className=v;else if(k==='dataset')Object.assign(n.dataset,v);else if(k.startsWith('on')&&typeof v==='function')n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':String(v))});if(text!=null)n.textContent=String(text);return n}
  function appendText(parent,tag,text,cls){const n=html(tag,cls?{class:cls}:{},text);parent.appendChild(n);return n}
  async function rpc(name,...args){if(!idToken)throw new Error('登入狀態已失效，請重新登入。');let response;try{response=await fetch('https://script.google.com/macros/s/AKfycbwINtgqsw6pE83V6Je0cjnJ6GWoKp0pD72HNKMFOTQcUecmfpJEN6gkBcb-G7aFUJ8q/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},credentials:'omit',body:JSON.stringify({action:name,args,credential:idToken})})}catch(e){throw new Error('無法連接出席管理服務，請檢查網絡後重試。')}if(!response.ok)throw new Error('出席管理服務暫時無法使用，請稍後重試。');let payload;try{payload=await response.json()}catch(e){throw new Error('服務回應格式無效，請稍後重試。')}if(!payload||payload.ok!==true){const detail=payload&&typeof payload.error==='string'?payload.error:'伺服器拒絕此操作。';throw new Error(detail)}return payload.result}
  function errorMessage(e){return e&&e.message?e.message:String(e||'發生不明錯誤')}
  function headersFor(entity){const raw=state.app&&state.app.schemas&&state.app.schemas[entity];if(Array.isArray(raw))return raw.map(x=>typeof x==='string'?x:(x&&x.name)||'').filter(Boolean);if(raw&&typeof raw==='object'){if(Array.isArray(raw.headers))return raw.headers.map(String);return Object.keys(raw)}return []}
  function recordsFor(entity){const raw=state.app&&state.app.data&&state.app.data[entity];return Array.isArray(raw)?raw.filter(x=>x&&typeof x==='object'):[]}
  function findHeader(entity,aliases){const hs=headersFor(entity);for(const a of aliases){const hit=hs.find(h=>String(h).trim().toLowerCase()===String(a).trim().toLowerCase());if(hit)return hit}return null}
  function keyHeader(entity){if(entity==='enrollments')return null;const c=ENTITY_CONFIG[entity];return findHeader(entity,c.aliases)||c.key}
  function valueFor(record,aliases){if(!record)return '';for(const a of aliases){if(Object.prototype.hasOwnProperty.call(record,a))return record[a]}return ''}
  const FIELD_ALIASES={studentId:['學生ID','student_id','studentId'],studentName:['學生姓名','姓名','student_name','name'],teacherGmail:['教師Gmail','Gmail','教師電郵','電郵','Email','email','teacher_email'],className:['班別','class_name','班級','班別名稱'],groupId:['組別ID','group_id','groupId'],groupName:['組別名稱','組別','group_name'],courseId:['課程ID','course_id','courseId'],courseName:['課程名稱','課程','course_name','name'],enabled:['啟用','狀態','enabled','active'],enrollStatus:['報讀狀態','狀態','enrollment_status','status'],courseRef:['課程ID','course_id','courseId'],groupRef:['組別ID','group_id','groupId'],classRef:['班別','class_name','班級','班別名稱']};
  function labelValue(record,aliases){return String(valueFor(record,aliases)||'')}
  function displayRecordLabel(entity,r){if(entity==='students')return [labelValue(r,FIELD_ALIASES.studentName),labelValue(r,FIELD_ALIASES.studentId)].filter(Boolean).join('（')+(labelValue(r,FIELD_ALIASES.studentId)?'）':'');if(entity==='courses')return [labelValue(r,FIELD_ALIASES.courseName),labelValue(r,FIELD_ALIASES.courseId)].filter(Boolean).join('（')+(labelValue(r,FIELD_ALIASES.courseId)?'）':'');if(entity==='groups')return [labelValue(r,FIELD_ALIASES.groupName),labelValue(r,FIELD_ALIASES.groupId)].filter(Boolean).join('（')+(labelValue(r,FIELD_ALIASES.groupId)?'）':'');return String(r[keyHeader(entity)]||Object.values(r).find(Boolean)||'')}
  function getEntityKey(entity,record){if(entity==='enrollments'){const sid=labelValue(record,FIELD_ALIASES.studentId),cid=labelValue(record,FIELD_ALIASES.courseId);return sid+'|'+cid}const key=keyHeader(entity);if(!key)return '';const value=String(record[key]??'');if(entity==='teachers')return value.split(',').map(x=>x.trim().toLowerCase()).sort().join(',');return value}
  function hkToday(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return o.year+'-'+o.month+'-'+o.day}
  function dateDisplay(d){if(!d)return '';const p=d.split('-');return p.length===3?`${p[0]}年${Number(p[1])}月${Number(p[2])}日`:d}
  function makePageTitle(title,sub){const h=html('h1',{class:'page-title'},title);main.appendChild(h);if(sub)appendText(main,'p',sub,'page-subtitle')}
  function card(title,subtitle){const c=html('section',{class:'card'});if(title){const head=html('div',{class:'card-head'});const h=html('h2',{},title);head.appendChild(h);if(subtitle)head.appendChild(html('span',{class:'muted small'},subtitle));c.appendChild(head)}return c}
  function navRender(){navInner.replaceChildren();const items=state.role==='admin'?NAV_ADMIN:NAV_TUTOR;items.forEach(([id,label,sym])=>{const b=html('button',{class:'nav-tab'+(state.page===id?' active':''),type:'button', 'aria-current':state.page===id?'page':null});b.append(html('span',{class:'nav-symbol','aria-hidden':'true'},sym),html('span',{},label));b.addEventListener('click',()=>navigate(id));navInner.appendChild(b)});nav.classList.remove('hidden')}
  function navigate(page){if(!state.authorized||state.busy)return;const valid=(state.role==='admin'?NAV_ADMIN:NAV_TUTOR).some(x=>x[0]===page);if(!valid)page='overview';state.page=page;state.preview=null;state.previewRequest++;setLoading(false);clearError();navRender();renderPage()}
  function renderPage(){main.replaceChildren();if(state.page==='overview')renderOverview();else if(state.page==='attendance')renderAttendance();else if(['teachers','groups','courses','students','enrollments'].includes(state.page))renderEntity(state.page);if(state.busy)setBusy(true)}

  async function saveEntity(entity,original,form,saveButton){if(state.busy)return;clearError();const record={},headers=headersFor(entity);for(const h of headers){const inp=Array.from(form.querySelectorAll('input,select,textarea')).find(x=>x.id&&form.querySelector('label[for="'+CSS.escape(x.id)+'"]')?.textContent===h);if(!inp)continue;if(inp.disabled&&original){record[h]=original[h]??'';continue}const v=inp.value.trim();if(entity==='classes'&&isKeyField(entity,h)&&!v){inp.focus();showError('班別名稱為必要欄位。');return}if(entity==='teachers'&&isKeyField(entity,h)&&!v){inp.focus();showError('教師 Gmail 為必要欄位。');return}if(inp.hasAttribute('data-multi-gmail')&&v){const items=v.split(',').map(x=>x.trim()).filter(Boolean),invalid=items.find(x=>!/^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(x));if(invalid){inp.focus();showError('Gmail 請以半形逗號分隔，並檢查此電郵格式：'+invalid);return}record[h]=items.join(', ')}else record[h]=v}if(entity==='enrollments'){const sid=FIELD_ALIASES.studentId.map(a=>record[a]).find(Boolean),cid=FIELD_ALIASES.courseId.map(a=>record[a]).find(Boolean);if(!sid||!cid){showError('報讀記錄必須選擇學生及課程。');return}}setBusy(true);setLoading(true,'正在儲存並核對記錄…');try{const originalKey=original?getEntityKey(entity,original):'',result=await rpc('saveRecord',entity,originalKey,record);if(!result||result.ok!==true||result.verified_readback!==true||!result.record)throw new Error('伺服器未確認儲存及讀回核對；未顯示成功。');const data=state.app.data[entity];if(!Array.isArray(data))state.app.data[entity]=[];const saved=result.record,newKey=getEntityKey(entity,saved),idx=state.app.data[entity].findIndex(r=>getEntityKey(entity,r)===String(originalKey));if(original&&idx<0)throw new Error('伺服器已回報寫入，但本地原記錄無法對應；請重新載入核對。');if(original)state.app.data[entity][idx]=saved;else{const found=state.app.data[entity].findIndex(r=>getEntityKey(entity,r)===newKey);if(found>=0)state.app.data[entity][found]=saved;else state.app.data[entity].push(saved)}modalRoot.replaceChildren();state.entity=null;state.editingKey=null;renderPage();const done=html('div',{class:'notice'});done.append(html('strong',{},'已儲存並完成讀回核對'),document.createTextNode(ENTITY_LABEL[entity]+'記錄已更新。'));main.prepend(done)}catch(e){showError('儲存失敗：'+errorMessage(e))}finally{setBusy(false);setLoading(false)}}
  function failClosed(){state.authorized=false;nav.classList.add('hidden');userChip.hidden=true;main.replaceChildren();const box=html('section',{class:'card access-denied'});appendText(box,'h2','未能完成登入或確認權限');appendText(box,'p','請確認使用已獲授權嘅 Gmail，並聯絡管理員確認帳戶權限後再試。為保障私隱，本頁不會顯示其他使用者或學生資料。');main.appendChild(box);$('#topNotice').hidden=true}
  function showSigninError(){signinError.textContent='登入或授權未能完成。請確認使用已獲授權嘅 Gmail，並聯絡管理員確認權限後再試。為保障私隱，本頁不會顯示其他使用者或學生資料。';signinError.hidden=false}
  function whenGisReady(callback){const gate=window.__attendanceGisGate;if(gate.ready){callback(true);return}if(gate.failed){callback(false);return}gate.callbacks.push(callback)}
  function receiveCredential(response){if(state.busy)return;const credential=response&&response.credential;if(typeof credential!=='string'||!credential){showSigninError();return}idToken=credential;signinError.hidden=true;signinPanel.hidden=true;main.hidden=false;$('#topNotice').hidden=false;resetButton.hidden=false;boot()}
  function renderGoogleButton(ready){if(!ready||!window.google||!google.accounts||!google.accounts.id){showSigninError();return}try{google.accounts.id.initialize({client_id:'682567272090-6fof89a84n1lunqavo2hiks0ujg4l1d3.apps.googleusercontent.com',callback:receiveCredential,auto_select:false});google.accounts.id.renderButton($('#gisButton'),{type:'standard',theme:'outline',size:'large',text:'signin_with',shape:'rectangular',locale:'zh-TW',width:300})}catch(e){showSigninError()}}
  function resetSession(){if(state.busy)return;idToken=null;try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect()}catch(e){}state.app=null;state.authorized=false;state.role='';state.email='';state.page='';state.date='';state.courseId='';state.roster=null;state.marks={};state.preview=null;state.rosterBusy=false;state.rosterRequest++;state.previewRequest++;state.entity=null;state.editingKey=null;modalRoot.replaceChildren();main.replaceChildren();main.hidden=true;nav.classList.add('hidden');navInner.replaceChildren();userChip.textContent='';userChip.hidden=true;resetButton.hidden=true;$('#topNotice').hidden=true;alertBox.textContent='';alertBox.hidden=true;setLoading(false);signinError.hidden=true;signinPanel.hidden=false}
  resetButton.addEventListener('click',resetSession);
  async function boot(){if(!idToken)return;state.date=hkToday();setBusy(true);setLoading(true,'正在驗證帳戶並載入資料…');try{const result=await rpc('getAppData');if(!result||!result.email||!String(result.email).trim()||!['admin','tutor'].includes(result.role)||!result.schemas||!result.data)throw new Error('帳戶資訊或存取權限未能確認。');for(const entity of ENTITIES){if(!Array.isArray(result.data[entity]))throw new Error('伺服器未提供完整資料：'+ENTITY_LABEL[entity]);if(!result.schemas[entity])throw new Error('伺服器未提供資料欄位結構：'+ENTITY_LABEL[entity])}state.app=result;state.email=String(result.email).trim();state.role=result.role;state.authorized=true;userChip.textContent=state.email+' · '+(state.role==='admin'?'管理員':'教師');userChip.hidden=false;state.page='overview';navRender();renderPage()}catch(e){failClosed()}finally{setLoading(false);setBusy(false)}}
